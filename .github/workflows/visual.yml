name: Visual

# Screenshot tests of the lake and the field log (README "Visual tests"). The baselines are made here, in the
# Playwright container, so fonts and the software renderer match from run to run.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Write new baselines (download them from the run's visual-results artifact and commit them)"
        type: boolean
        default: false
      repeat_each:
        description: "Run each test this many times (to check for flakes)"
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm visual --repeat-each ${{ inputs.repeat_each || 1 }} ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: "true"
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-results
          path: |
            test-results/visual
            test-results/visual-report
            e2e/visual/__screenshots__
          if-no-files-found: ignore
          retention-days: 14
